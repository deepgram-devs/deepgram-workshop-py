[project]
name = "deepgram-voice-ai-workshop"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepgram-sdk==7.6.0",
    "numpy==2.5.1",
    "python-dotenv==1.2.2",
    "sounddevice==0.5.5",
]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
